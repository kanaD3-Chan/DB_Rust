[package]
name = "forum-client"
version.workspace = true
edition.workspace = true

[dependencies]
crossterm = "0.29.0"
futures-util = "0.3.32"
ratatui = { version = "0.30.0", features = ["macros"] }
reqwest = { version = "0.13.3", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["full"] }
tokio-tungstenite = { version = "0.29.0", features = ["connect"] }
tui-markdown = "0.3.7"
